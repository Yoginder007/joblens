# Render Blueprint for the JobLens API (free tier).
#
# DB: use Neon (free Postgres + pgvector) and paste its connection string into
# DATABASE_URL below in the Render dashboard — Render's own free Postgres does
# NOT support the pgvector extension.
#
# Memory: free instances have 512 MB, so embeddings come from the Gemini API
# (EMBEDDING_PROVIDER=gemini — an HTTP call, no torch in the image) and
# CELERY_TASK_ALWAYS_EAGER=true (no separate worker/Redis).
# After switching providers, regenerate vectors once:
#   POST /api/reembed (X-API-Key) → poll GET /api/reembed/status
services:
  - type: web
    name: joblens-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-prod.txt
    startCommand: bash start_prod.sh
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: RESUME_PARSER
        value: gemini              # LLM structured extraction; falls back to regex
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: VERIFY_JOB_URLS
        value: "false"            # free dynos cold-start; skip live HEAD checks
      - key: UPLOAD_DIR
        value: /tmp/uploads        # free tier has only ephemeral disk
      - key: PYTHON_VERSION
        value: "3.11.9"
      # ── Set these in the dashboard (Secret) ─────────────────────────────
      - key: DATABASE_URL
        sync: false                # Neon connection string (postgresql+psycopg2://…)
      - key: SCRAPER_API_KEY
        sync: false                # any strong random string
      - key: GOOGLE_API_KEY
        sync: false                # Gemini API key (embeddings)
      - key: CORS_ORIGINS
        sync: false                # https://<your-vercel-app>.vercel.app
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: ADZUNA_COUNTRY
        value: in
      # ── Apify scrapers (paid, weekly). Token + per-actor input JSON are
      #    secrets/long → set them in the dashboard; actor ids + cap are safe defaults.
      - key: APIFY_TOKEN
        sync: false
      - key: APIFY_LINKEDIN_ACTOR
        value: curious_coder~linkedin-jobs-scraper
      - key: APIFY_INDEED_ACTOR
        value: misceres~indeed-scraper
      - key: APIFY_MAX_ITEMS
        value: "50"
      - key: APIFY_LINKEDIN_INPUT
        sync: false
      - key: APIFY_INDEED_INPUT
        sync: false

# Keep the free-tier backend warm during active hours so most visits skip the
# 30-90s cold start entirely. The in-app waking screen (BackendWakingScreen)
# still covers visits outside this window.
#
# Window: every 10 min, 02:30-18:30 UTC ≈ 08:00 IST - 00:00 IST. A single free
# Render service stays well inside the monthly free-hours budget at ~16h/day.
name: Keep-alive ping

on:
  schedule:
    - cron: "*/10 2-18 * * *"
  workflow_dispatch: {}

env:
  API: https://joblens-api-xi3l.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          # A cold instance may take a while on the first hit; that's fine —
          # the point of the request is to (re)start it. Never fail the run.
          curl -sf --max-time 60 "$API/api/health" > /dev/null \
            && echo "backend healthy" \
            || echo "backend waking (expected right after an idle period)"
